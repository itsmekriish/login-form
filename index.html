<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <!-- Correct Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="login-form">
        <h2 class="heading">Login</h2>
        <form action="">
            <div id="user-container">
                <label for="username">Username</label>
                <br>
                <i class="fa-regular fa-user fa-1x"></i>
                <input type="text" name="username" placeholder="Type your username">
            </div>
            <br><br>

            <div id="password-container">
                <label for="password">Password</label>
                <br>
                <i class="fa-solid fa-user-lock fa-1x"></i>
                <input type="text" name="password" id="password" placeholder="Type your password">
                <p><a href="#">Forgot password?</a></p>
            </div>
            <br><br>

            <input type="submit" value="Login" id="button">
        </form>

        <p class="signup-option">Or Sign Up Using</p>
        <div class="social-icons">
            <i class="fa-brands fa-google fa-1x"></i>
            <i class="fa-brands fa-facebook fa-1x"></i>
            <i class="fa-brands fa-x-twitter fa-1x"></i>
        </div>

        <div id="last-item">
            <p class="signup-option">Or Sign Up Using</p>
            <p class="sign-up">Sign up</p>
        </div>
    </div>
</body>

</html>
